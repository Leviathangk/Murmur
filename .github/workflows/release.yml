# Pushing a tag such as v0.2.0 builds the installers of that version and
# attaches them to its GitHub release: the workflow creates the release, or
# fills the one published first with the tag. Run by hand, it builds the
# version in mygo.json and keeps the packages as an artifact of the run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # MyGo compiles every platform from a Mac, and only macOS makes the
    # disk image.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # For the Windows installers; without it mygo build makes only
      # Murmur.exe.
      - name: Install NSIS
        run: brew install makensis

      # The packages and the app take their version from mygo.json.
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version such as v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          jq --arg v "$version" '.version = $v' mygo.json > mygo.json.new
          mv mygo.json.new mygo.json

      - name: Test
        run: go test ./...

      - name: Build
        run: go tool mygo build -platform darwin/universal,windows/amd64,windows/arm64

      # Names without spaces, which GitHub would turn into dots.
      - name: Collect the packages
        run: |
          version=$(jq -r .version mygo.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir dist
          cp "build/darwin-universal/Murmur $version.dmg" "dist/Murmur-$version-macos-universal.dmg"
          for arch in amd64 arm64; do
            cp "build/windows-$arch/Murmur Setup $version $arch.exe" "dist/Murmur-Setup-$version-windows-$arch.exe"
            # The portable app: what the installer installs.
            (cd "build/windows-$arch" && zip -qr "../../dist/Murmur-$version-windows-$arch-portable.zip" . -x "Murmur Setup *")
          done
          (cd dist && shasum -a 256 -- * > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: Murmur-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
